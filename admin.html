<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Little Loop</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{--bg:#fffdfb;--surface:#ffffff;--card:#fff9f8;--text:#000000;--text-soft:#222222;--muted:#444444;--accent:#d795a7;--accent-hover:#c98296;--pink:#f8dce4;--green:#dfeee5;--yellow:#f8edcc;--blue:#dceaf3;--shadow:rgba(90,70,70,.10);}
    body.dark{--bg:#09070d;--surface:#110d17;--card:#17111f;--text:#f7effd;--text-soft:#c8b9d1;--muted:#9989a4;--accent:#bd7cff;--accent-hover:#d19cff;--pink:#352039;--green:#1b3028;--yellow:#342b18;--blue:#20243a;}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Comfortaa",sans-serif;background:linear-gradient(135deg,var(--bg),#f0e5e5);color:var(--text);line-height:1.6;transition:background .5s ease,color .5s ease;min-height:100vh;}
    body.dark{background:linear-gradient(135deg,#09070d,#1a1220);}

    .admin-header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.2);position:sticky;top:0;z-index:100;}
    .admin-header h1{color:var(--text);font-size:1.8rem;}
    .admin-header button{background:var(--accent);border:none;padding:10px 20px;border-radius:50px;color:white;cursor:pointer;font-family:inherit;font-size:0.9rem;transition:all .3s ease;}
    .admin-header button:hover{background:var(--accent-hover);transform:translateY(-2px);}

    .admin-tabs{display:flex;gap:20px;padding:20px 7%;background:transparent;}
    .admin-tab{padding:10px 25px;border-radius:50px;background:var(--card);cursor:pointer;font-weight:600;color:var(--muted);transition:all .3s ease;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;}
    .admin-tab.active{background:var(--accent);color:white;}
    
    /* Badges & Dots */
    .badge {
      display: inline-block;
      background: #ff3b30;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 0.7rem;
      margin-left: 8px;
      font-weight: bold;
    }
    .red-dot-ind {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff3b30;
      display: inline-block;
      margin-left: 5px;
    }
    .blue-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #007aff;
      display: inline-block;
      margin-left: 8px;
      vertical-align: middle;
    }

    .admin-container{padding:30px 7%;display:none;height:85vh;}
    .admin-container.active{display:flex;gap:30px;}

    .orders-panel{flex:1;overflow-y:auto;background:var(--card);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 10px 30px var(--shadow);}
    .order-admin-card{background:var(--surface);border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 5px 15px var(--shadow);border-left:4px solid var(--accent);}
    .order-admin-card h4{color:var(--text);font-size:1rem;margin-bottom:5px;}
    .order-admin-card p{font-size:0.8rem;color:var(--muted);margin-bottom:5px;}
    .order-items-admin{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;margin-top:10px;}
    .order-item-admin{background:var(--pink);padding:5px 10px;border-radius:10px;font-size:0.8rem;}
    .status-select{padding:8px 12px;border-radius:50px;border:none;background:var(--surface);color:var(--text);font-family:inherit;font-weight:600;cursor:pointer;margin-right:5px;}
    .status-select.pending{background:var(--yellow);}
    .status-select.paid{background:var(--green);}
    .status-select.shipped{background:var(--blue);}
    .status-select.delivered{background:var(--pink);}
    .status-select.cancelled{background:var(--muted);color:white;}
    .status-select.refunded{background:var(--blue);color:var(--text);}
    .send-mail-btn,.details-btn{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:50px;cursor:pointer;font-family:inherit;font-size:0.8rem;margin-left:5px;transition:all .3s ease;}
    .send-mail-btn:hover,.details-btn:hover{background:var(--accent-hover);}
    .send-mail-btn:disabled{opacity:0.6;cursor:not-allowed;}
    .details-btn{background:var(--muted);}

    .customer-list{flex:1;background:var(--card);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,0.3);overflow-y:auto;box-shadow:0 10px 30px var(--shadow);}
    .customer-item{padding:15px;border-radius:15px;margin-bottom:10px;cursor:pointer;background:var(--surface);transition:all 0.3s ease;display:flex;align-items:center;justify-content:space-between;}
    .customer-item:hover,.customer-item.active{background:var(--pink);}
    .customer-item h4{margin-bottom:5px;font-size:1rem;color:var(--text);}
    .customer-item p{font-size:0.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .admin-chat{flex:2;background:var(--card);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,0.3);display:flex;flex-direction:column;box-shadow:0 10px 30px var(--shadow);}
    .chat-window{flex-grow:1;overflow-y:auto;margin-bottom:20px;background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:15px;}
    .chat-msg{max-width:80%;padding:12px 18px;border-radius:18px;line-height:1.4;font-size:.9rem;}
    .chat-msg.user{align-self:flex-start;background:var(--surface);color:var(--text);border-bottom-left-radius:4px;}
    .chat-msg.admin{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:4px;}
    .chat-input-area{display:flex;gap:10px;}
    .chat-input{flex:1;padding:14px;border:1px solid rgba(120,100,120,.2);border-radius:30px;background:var(--surface);color:var(--text);font-size:1rem;outline:none;}
    .chat-input:focus{border-color:var(--accent);}
    .chat-send{padding:12px 24px;border:none;border-radius:30px;background:var(--accent);color:white;cursor:pointer;font-weight:600;}

    .admin-login-required{display:flex;justify-content:center;align-items:center;height:80vh;font-size:1.2rem;color:var(--text);text-align:center;}
    @media(max-width:750px){.admin-container{flex-direction:column;height:auto;}.admin-chat{height:400px;}}
  </style>
</head>

<body>
<div id="adminContent" style="display:none;">
  <div class="admin-header">
    <h1>♡ Little Loop Admin</h1>
    <button onclick="logoutAdmin()">Logout</button>
  </div>
  
  <div class="admin-tabs">
    <div class="admin-tab active" id="tabOrders" onclick="switchTab('orders')">
      📦 Orders <span id="ordersBadge" class="badge" style="display:none;">0</span>
    </div>
    <div class="admin-tab" id="tabChats" onclick="switchTab('chats')">
      💬 Chats <span id="chatsBadge" class="badge" style="display:none;">0</span>
    </div>
  </div>

  <div class="admin-container active" id="ordersContainer">
    <div class="orders-panel" id="ordersListPanel">
      <h2 style="margin-bottom:20px;">All Orders</h2>
      <div id="allOrdersList"></div>
    </div>
  </div>

  <div class="admin-container" id="chatsContainer">
    <div class="customer-list" id="customerList"></div>
    <div class="admin-chat">
      <div class="chat-window" id="adminChatWindow"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="adminChatInput" placeholder="Type your reply..." />
        <button class="chat-send" onclick="sendAdminMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="admin-login-required" id="loginRequired">Loading Admin Panel... Please Log In.</div>

<script>
  const ADMIN_EMAIL = "mayankverma01092003@gmail.com";
  const ADMIN_UID = "ZqNEhhvYDCRe9InEE1P7wmGYiC92"; 
  const WORKER_URL = "https://little-loop-payments.mayankverma01092003.workers.dev";

  const firebaseConfig = {
    apiKey: "AIzaSyCeiXIZhofwxkUrWkowZuiMSHyRcsfeHE0",
    authDomain: "littleloopcrochet-2dcdf.firebaseapp.com",
    projectId: "littleloopcrochet-2dcdf",
    storageBucket: "littleloopcrochet-2dcdf.firebasestorage.app",
    messagingSenderId: "837032344744",
    appId: "1:837032344744:web:41f17ab83bb6071240969d",
    measurementId: "G-1F2GVL84HC"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let selectedCustomerId = null;
  let unsubscribeChat = null;
  let unsubscribeOrders = null;
  let unsubscribeCustomers = null;
  
  // Notification Logic
  let currentTab = 'orders';
  let unseenOrders = 0;
  let unseenChats = 0;
  let ordersLoadedOnce = false;
  let customersLoadedOnce = false;
  let totalOrderCount = 0;
  let totalCustomerCount = 0;
  let lastMessageFromUser = {};
  let modifiedOrders = {};

  function updateBadge(id, count) {
    const badge = document.getElementById(id);
    if (count > 0) {
      badge.textContent = count > 9 ? '9+' : count;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  }

  auth.onAuthStateChanged(function(user) {
    if (user && (user.email === ADMIN_EMAIL || user.uid === ADMIN_UID)) {
      currentUser = user;
      document.getElementById('adminContent').style.display = 'block';
      document.getElementById('loginRequired').style.display = 'none';
      loadOrders();
      loadCustomers();
    } else if (user) {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginRequired').style.display = 'block';
      document.getElementById('loginRequired').innerHTML = "Access Denied. You are not the Admin.";
    } else {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginRequired').style.display = 'block';
      document.getElementById('loginRequired').innerHTML = "Please <a href='index.html' style='color:var(--accent)'>Log In</a> to access the admin panel.";
    }
  });

  function logoutAdmin() { 
    if(unsubscribeOrders) unsubscribeOrders();
    if(unsubscribeCustomers) unsubscribeCustomers();
    if(unsubscribeChat) unsubscribeChat();
    auth.signOut().then(function() { window.location.href = 'index.html'; }); 
  }

  window.switchTab = function(tab) {
    currentTab = tab;
    document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
    document.getElementById('tabChats').classList.toggle('active', tab === 'chats');
    document.getElementById('ordersContainer').classList.toggle('active', tab === 'orders');
    document.getElementById('chatsContainer').classList.toggle('active', tab === 'chats');
    
    if (tab === 'orders') {
      unseenOrders = 0;
      updateBadge('ordersBadge', 0);
      loadOrders();
    }
    if (tab === 'chats') {
      unseenChats = 0;
      updateBadge('chatsBadge', 0);
      loadCustomers();
    }
  };

  // ===== ORDERS MANAGEMENT =====
  function loadOrders() {
    if (unsubscribeOrders) unsubscribeOrders();
    unsubscribeOrders = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(function(querySnapshot) {
      
      // Check for new orders (Global Badge)
      const newOrderCount = querySnapshot.size;
      if (ordersLoadedOnce) {
        if (newOrderCount > totalOrderCount && currentTab !== 'orders') {
          unseenOrders += (newOrderCount - totalOrderCount);
          updateBadge('ordersBadge', unseenOrders);
        }
      } else {
        ordersLoadedOnce = true;
      }
      totalOrderCount = newOrderCount;

      // Check for modified orders (Blue Dot)
      querySnapshot.docChanges().forEach(change => {
        if (change.type === 'modified') {
          modifiedOrders[change.doc.id] = true;
        }
      });

      const list = document.getElementById('allOrdersList');
      list.innerHTML = '';
      if (querySnapshot.empty) { 
        list.innerHTML = '<p style="color:var(--muted);">No orders yet.</p>'; 
        return; 
      }

      querySnapshot.forEach(function(doc) {
        const order = doc.data();
        const orderId = doc.id;
        const itemsHTML = (order.items || []).map(item => `<div class="order-item-admin">${item.name} (x${item.quantity}) - ₹${item.price * item.quantity}</div>`).join('');
        const status = order.status || 'pending';
        const email = order.email || '';
        const name = order.userName || 'Unknown';
        const phone = order.phone || 'N/A';
        const address = order.address || 'N/A';
        const total = order.total || 0;
        const addressStr = typeof address === 'object' ? JSON.stringify(address) : address;

        // Blue Dot Logic
        const isModified = modifiedOrders[orderId];
        const blueDotHTML = isModified ? `<span class="blue-dot" title="Order has been updated"></span>` : '';

        const cardHTML = `
          <div class="order-admin-card" id="order-${orderId}" data-email="${email}" data-name="${name}" data-total="${total}">
            <h4>Order #${orderId.slice(-6).toUpperCase()} (${name}) ${blueDotHTML}</h4>
            <p>Date: ${order.createdAt ? order.createdAt.toDate().toLocaleDateString('en-IN') : 'N/A'}</p>
            <p><strong>Phone:</strong> ${phone}</p>
            <p><strong>Email:</strong> ${email || 'N/A'}</p>
            <p><strong>Address:</strong> ${addressStr}</p>
            <div class="order-items-admin">${itemsHTML}</div>
            <p><strong>Total: ₹${total}</strong></p>
            <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
              <select class="status-select ${status}" onchange="changeOrderStatus('${orderId}', this.value)">
                <option value="pending" ${status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="paid" ${status === 'paid' ? 'selected' : ''}>Paid</option>
                <option value="shipped" ${status === 'shipped' ? 'selected' : ''}>Shipped</option>
                <option value="delivered" ${status === 'delivered' ? 'selected' : ''}>Delivered</option>
                <option value="cancelled" ${status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                <option value="refunded" ${status === 'refunded' ? 'selected' : ''}>Refunded</option>
              </select>
              <button class="send-mail-btn" onclick="sendStatusEmail('${orderId}', '${status}')">📧 Send Mail</button>
              <button class="details-btn" onclick="viewTransactionDetails('${orderId}')">🔍 Details</button>
            </div>
          </div>`;
        list.innerHTML += cardHTML;
      });
    }, function(err) { 
      console.error("Error loading orders: ", err); 
      list.innerHTML = '<p style="color:red;">Error loading orders.</p>'; 
    });
  }

  window.changeOrderStatus = async function(orderId, newStatus) {
    // Clear the blue dot on interaction
    delete modifiedOrders[orderId];

    const confirmMessage = newStatus === 'cancelled' ? "Change status to Cancelled and initiate refund?" : "Change status to " + newStatus + " and send email?";
    if (!confirm(confirmMessage)) { loadOrders(); return; }
    
    const idToken = await currentUser.getIdToken();
    const card = document.getElementById(`order-${orderId}`);
    const email = card.dataset.email;
    const name = card.dataset.name;
    const total = card.dataset.total;

    try {
      const response = await fetch(`${WORKER_URL}/api/send-status-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status: newStatus, idToken, email, name, total })
      });
      const data = await response.json();
      if (data.success) alert("Status updated and email sent!");
      else alert("Error: " + data.error);
    } catch (err) {
      console.error("Error updating status:", err);
      alert("Failed to update status.");
    }
  };

  window.sendStatusEmail = async function(orderId, status) {
    const btn = event.target; 
    const card = btn.closest('.order-admin-card');
    const email = card.dataset.email;
    const name = card.dataset.name;
    const total = card.dataset.total;
    if (!email) { alert("No email found for this order."); return; }
    if (!confirm("Send " + status + " email to " + email + "?")) return;

    const originalText = btn.textContent;
    btn.textContent = "Sending...";
    btn.disabled = true;

    try {
      const idToken = await currentUser.getIdToken();
      const response = await fetch(`${WORKER_URL}/api/send-status-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status, idToken, email, name, total })
      });
      const data = await response.json();
      if (data.success) alert("Email sent successfully!");
      else alert("Error: " + data.error);
    } catch (err) { console.error("Send email error:", err); alert("Failed to send email."); }
    finally { btn.textContent = originalText; btn.disabled = false; }
  };

  window.viewTransactionDetails = async function(orderId) {
    // Clear the blue dot on interaction
    delete modifiedOrders[orderId];

    try {
      const idToken = await currentUser.getIdToken();
      const response = await fetch(`${WORKER_URL}/api/admin/order-details`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, idToken })
      });
      const data = await response.json();
      if (!data.success) { alert("Error: " + data.error); return; }

      const pay = data.payment || {};
      const ref = data.refund || {};
      alert(`Payment ID: ${pay.id || 'N/A'}\nMethod: ${pay.method || 'N/A'}\nBank: ${pay.bank || 'N/A'}\nVPA: ${pay.vpa || 'N/A'}\nAmount: ₹${(pay.amount/100) || 'N/A'}\n\nRefund ID: ${ref.id || 'N/A'}\nRefund Status: ${ref.status || 'N/A'}`);
    } catch (err) { console.error(err); alert("Failed to fetch details."); }
  };

  // ===== CHATS MANAGEMENT (Individual Chat Red Dots) =====
  function loadCustomers() {
    const customerList = document.getElementById('customerList');
    if (unsubscribeCustomers) unsubscribeCustomers();
    
    unsubscribeCustomers = db.collection('chats').onSnapshot(function(querySnapshot) {
      
      // Global Badge Logic
      const newCustomerCount = querySnapshot.size;
      if (customersLoadedOnce) {
        if (newCustomerCount > totalCustomerCount && currentTab !== 'chats') {
          unseenChats += (newCustomerCount - totalCustomerCount);
          updateBadge('chatsBadge', unseenChats);
        }
      } else {
        customersLoadedOnce = true;
      }
      totalCustomerCount = newCustomerCount;

      customerList.innerHTML = '';
      if (querySnapshot.empty) { 
        customerList.innerHTML = '<p style="color:var(--muted);">No customers yet.</p>'; 
        return; 
      }

      const customerItems = [];
      const fetchLastMsgPromises = [];

      querySnapshot.forEach(function(userDoc) {
        const userId = userDoc.id;
        const data = userDoc.data();
        const displayName = data.userName || 'No name';
        const displayEmail = data.userEmail || 'No email';

        const item = document.createElement('div');
        item.className = 'customer-item';
        item.id = `customer-${userId}`;
        item.innerHTML = `<div><h4>${displayName}</h4><p>${displayEmail}</p></div>`;
        
        // Check if currently selected
        if (userId === selectedCustomerId) {
          item.classList.add('active');
        }
        
        item.addEventListener('click', function() { selectCustomer(userId, item); });
        customerItems.push({ userId, item });

        // Fetch last message for this user to check for red dot
        const lastMsgRef = db.collection('chats').doc(userId).collection('messages').orderBy('timestamp', 'desc').limit(1);
        const promise = lastMsgRef.get().then(snapshot => {
          if (!snapshot.empty) {
            const msgData = snapshot.docs[0].data();
            // If last message is from user, and it's not the currently selected chat, add red dot
            if (msgData.sender === 'user' && userId !== selectedCustomerId) {
              lastMessageFromUser[userId] = true;
              item.innerHTML += `<span class="red-dot-ind"></span>`;
            } else {
              lastMessageFromUser[userId] = false;
            }
          }
        });
        fetchLastMsgPromises.push(promise);
      });

      // Render items after fetching last messages
      Promise.all(fetchLastMsgPromises).then(() => {
        customerItems.forEach(({ item }) => customerList.appendChild(item));
      });
    }, function(err) { 
      console.error("Error loading customers: ", err); 
      customerList.innerHTML = '<p style="color:red;">Error loading customers.</p>'; 
    });
  }

  function selectCustomer(userId, element) {
    selectedCustomerId = userId;
    
    // Clear the red dot for this specific chat
    lastMessageFromUser[userId] = false;
    const dot = document.getElementById(`customer-${userId}`).querySelector('.red-dot-ind');
    if (dot) dot.remove();

    document.querySelectorAll('.customer-item').forEach(function(item) { item.classList.remove('active'); });
    element.classList.add('active');
    loadAdminChat(userId);
  }

  function loadAdminChat(userId) {
    const chatWindow = document.getElementById('adminChatWindow');
    chatWindow.innerHTML = '';
    if (unsubscribeChat) unsubscribeChat();
    unsubscribeChat = db.collection('chats').doc(userId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(function(querySnapshot) {
      chatWindow.innerHTML = '';
      querySnapshot.forEach(function(doc) {
        const data = doc.data();
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('chat-msg');
        msgDiv.classList.add(data.sender === 'user' ? 'user' : 'admin');
        msgDiv.textContent = data.text;
        chatWindow.appendChild(msgDiv);
      });
      chatWindow.scrollTop = chatWindow.scrollHeight;
    });
  }

  function sendAdminMessage() {
    const input = document.getElementById('adminChatInput');
    const text = input.value.trim();
    if (!text || !selectedCustomerId) return;
    db.collection('chats').doc(selectedCustomerId).collection('messages').add({
      sender: 'admin',
      text: text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() { input.value = ''; }).catch(function(err) { console.error("Error sending message: ", err); });
  }

  document.getElementById('adminChatInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); sendAdminMessage(); } });
</script>
</body>
</html>
