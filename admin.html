<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Little Loop</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{--bg:#fffdfb;--surface:#ffffff;--card:#fff9f8;--text:#000000;--text-soft:#222222;--muted:#444444;--accent:#d795a7;--accent-hover:#c98296;--pink:#f8dce4;--green:#dfeee5;--shadow:rgba(90,70,70,.10);}
    body.dark{--bg:#09070d;--surface:#110d17;--card:#17111f;--text:#f7effd;--text-soft:#c8b9d1;--muted:#9989a4;--accent:#bd7cff;--accent-hover:#d19cff;--pink:#352039;--green:#1b3028;}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Comfortaa",sans-serif;background:transparent;color:var(--text);line-height:1.6;transition:background .5s ease,color .5s ease;overflow-x:hidden;}
    body{position:relative;isolation:isolate}
    #aboutCanvas{position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;z-index:-2 !important;pointer-events:none !important;display:block}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.12),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.05))}

    .admin-header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;}
    .admin-header h1{color:var(--text);font-size:1.8rem;}
    .admin-header button{background:var(--accent);border:none;padding:10px 20px;border-radius:50px;color:white;cursor:pointer;font-family:inherit;font-size:0.9rem;}
    .admin-header button:hover{background:var(--accent-hover);}

    .admin-container{padding:20px 7%;display:flex;gap:30px;height:85vh;}
    .customer-list{flex:1;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,0.3);overflow-y:auto;}
    body.dark .customer-list{background:rgba(0,0,0,0.2);border-color:rgba(255,255,255,0.1);}
    .customer-item{padding:15px;border-radius:15px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:all 0.3s ease;}
    .customer-item:hover,.customer-item.active{background:var(--pink);}
    .customer-item h4{margin-bottom:5px;font-size:1rem;color:var(--text);}
    .customer-item p{font-size:0.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .admin-chat{flex:2;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,0.3);display:flex;flex-direction:column;}
    body.dark .admin-chat{background:rgba(0,0,0,0.2);border-color:rgba(255,255,255,0.1);}
    .chat-window{flex-grow:1;overflow-y:auto;margin-bottom:20px;background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:15px;}
    .chat-msg{max-width:80%;padding:12px 18px;border-radius:18px;line-height:1.4;font-size:.9rem;}
    .chat-msg.user{align-self:flex-start;background:var(--surface);color:var(--text);border-bottom-left-radius:4px;}
    .chat-msg.admin{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:4px;}
    .chat-input-area{display:flex;gap:10px;}
    .chat-input{flex:1;padding:14px;border:1px solid rgba(120,100,120,.2);border-radius:30px;background:var(--card);color:var(--text);font-size:1rem;outline:none;}
    .chat-input:focus{border-color:var(--accent);}
    .chat-send{padding:12px 24px;border:none;border-radius:30px;background:var(--accent);color:white;cursor:pointer;font-weight:600;}
    .chat-send:hover{background:var(--accent-hover);}

    .admin-login-required{display:flex;justify-content:center;align-items:center;height:80vh;font-size:1.2rem;color:var(--text);text-align:center;}
    @media(max-width:750px){.admin-container{flex-direction:column;height:auto;}.admin-chat{height:400px;}}
  </style>
</head>

<body>
<canvas id="aboutCanvas" aria-hidden="true"></canvas>

<div id="adminContent" style="display:none;">
  <div class="admin-header">
    <h1>Little Loop Admin</h1>
    <button onclick="logoutAdmin()">Logout</button>
  </div>
  <div class="admin-container">
    <div class="customer-list" id="customerList"></div>
    <div class="admin-chat">
      <div class="chat-window" id="adminChatWindow"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="adminChatInput" placeholder="Type your reply..." />
        <button class="chat-send" onclick="sendAdminMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="admin-login-required" id="loginRequired">Loading Admin Panel... Please Log In.</div>

<script>
  const ADMIN_EMAIL = "mayankverma01092003@gmail.com";
  const ADMIN_UID = "ZqNEhhvYDCRe9InEE1P7wmGYiC92"; // Leave empty or put your UID

  const firebaseConfig = {
    apiKey: "AIzaSyCeiXIZhofwxkUrWkowZuiMSHyRcsfeHE0",
    authDomain: "littleloopcrochet-2dcdf.firebaseapp.com",
    projectId: "littleloopcrochet-2dcdf",
    storageBucket: "littleloopcrochet-2dcdf.firebasestorage.app",
    messagingSenderId: "837032344744",
    appId: "1:837032344744:web:41f17ab83bb6071240969d",
    measurementId: "G-1F2GVL84HC"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let selectedCustomerId = null;
  let unsubscribeChat = null;

  auth.onAuthStateChanged(function(user) {
    if (user && (user.email === ADMIN_EMAIL || user.uid === ADMIN_UID)) {
      currentUser = user;
      document.getElementById('adminContent').style.display = 'block';
      document.getElementById('loginRequired').style.display = 'none';
      loadCustomers();
    } else if (user) {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginRequired').style.display = 'block';
      document.getElementById('loginRequired').innerHTML = "Access Denied. You are not the Admin.";
    } else {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginRequired').style.display = 'block';
      document.getElementById('loginRequired').innerHTML = "Please <a href='index.html' style='color:var(--accent)'>Log In</a> to access the admin panel.";
    }
  });

  function logoutAdmin() {
    auth.signOut().then(function() { window.location.href = 'index.html'; });
  }

  function loadCustomers() {
    const customerList = document.getElementById('customerList');
    customerList.innerHTML = 'Loading...';

    db.collection('chats').get().then(function(querySnapshot) {
      customerList.innerHTML = '';
      
      if (querySnapshot.empty) {
        customerList.innerHTML = '<p style="color:var(--muted);">No customers yet. Ask someone to try the contact page!</p>';
        return;
      }

      querySnapshot.forEach(function(userDoc) {
        const userId = userDoc.id;
        // Create a customer item
        const item = document.createElement('div');
        item.className = 'customer-item';
        // For now, just show the User ID (cryptic string)
        // If you want to show emails, we need to add email saving to contact.html
        item.innerHTML = '<h4>User: ' + userId.substring(0, 8) + '...</h4><p>Click to view chat</p>';
        
        // Click listener
        item.addEventListener('click', function() {
          selectCustomer(userId, item);
        });

        customerList.appendChild(item);
      });
    }).catch(function(err) {
      console.error("Error loading customers: ", err);
      customerList.innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
    });
  }

  function selectCustomer(userId, element) {
    selectedCustomerId = userId;
    
    document.querySelectorAll('.customer-item').forEach(function(item) {
      item.classList.remove('active');
    });
    element.classList.add('active');

    loadAdminChat(userId);
  }

  function loadAdminChat(userId) {
    const chatWindow = document.getElementById('adminChatWindow');
    chatWindow.innerHTML = '';

    if (unsubscribeChat) {
      unsubscribeChat();
    }

    unsubscribeChat = db.collection('chats').doc(userId).collection('messages')
      .orderBy('timestamp', 'asc')
      .onSnapshot(function(querySnapshot) {
        chatWindow.innerHTML = '';
        querySnapshot.forEach(function(doc) {
          const data = doc.data();
          const msgDiv = document.createElement('div');
          msgDiv.classList.add('chat-msg');
          msgDiv.classList.add(data.sender === 'user' ? 'user' : 'admin');
          msgDiv.textContent = data.text;
          chatWindow.appendChild(msgDiv);
        });
        chatWindow.scrollTop = chatWindow.scrollHeight;
      });
  }

  function sendAdminMessage() {
    const input = document.getElementById('adminChatInput');
    const text = input.value.trim();
    
    if (!text || !selectedCustomerId) return;

    db.collection('chats').doc(selectedCustomerId).collection('messages').add({
      sender: 'admin',
      text: text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      input.value = '';
    }).catch(function(err) {
      console.error("Error sending message: ", err);
    });
  }

  document.getElementById('adminChatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); sendAdminMessage(); }
  });

  // Background Logic (Same as main site)
  (function() {
      const canvas=document.getElementById('aboutCanvas'); if(!canvas)return;
      const ctx=canvas.getContext('2d',{alpha:true});
      let width=0,height=0,dpr=1,time=0,raf=0;
      let isDark=document.body.classList.contains('dark');
      const mouse={x:.5,y:.5,tx:.5,ty:.5};
      let stars=[],clouds=[],butterflies=[],fireflies=[],meteors=[],flowers=[],reeds=[],birds=[];
      const rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
      function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);init();}
      function init(){
        stars=Array.from({length:145},()=>({x:rand(0,1),y:rand(.025,.56),r:rand(.3,1.35),p:rand(0,6.28),tw:rand(.5,1.8)}));
        clouds=Array.from({length:6},()=>({x:rand(-.3,1),y:rand(.08,.32),w:rand(130,290),h:rand(28,70),s:rand(.008,.018),a:rand(.16,.34)}));
        butterflies=Array.from({length:9},()=>({x:rand(.06,.94),y:rand(.40,.69),vx:rand(-.00018,.00018),vy:rand(-.00010,.00010),p:rand(0,6.28),h:rand(315,350),size:rand(7,11)}));
        fireflies=Array.from({length:34},()=>({x:rand(.03,.97),y:rand(.45,.91),vx:rand(-.00015,.00015),vy:rand(-.00012,.00012),p:rand(0,6.28),r:rand(1,2.2)}));
        meteors=Array.from({length:6},()=>({active:false,x:0,y:0,vx:0,vy:0,life:0,max:0}));
        flowers=Array.from({length:34},(_,i)=>({x:rand(.01,.99),y:rand(.70,.94),s:rand(.6,1.1),p:rand(0,6.28),h:[332,350,28,48,285,198][i%6]}));
        reeds=Array.from({length:90},()=>({x:rand(0,1),y:rand(.67,.99),h:rand(13,45),p:rand(0,6.28),a:rand(.25,.75)}));
        birds=Array.from({length:4},()=>({x:rand(.1,.9),y:rand(.18,.38),v:rand(.00005,.00011),p:rand(0,6.28)}));
      }
      function hill(y,amp,phase){ctx.beginPath();ctx.moveTo(-10,height*y);for(let x=-10;x<=width+10;x+=Math.max(18,width/20)){const n=x/width;const yy=height*(y+Math.sin(n*7+phase)*amp+Math.sin(n*2.8+phase)*amp*.5);ctx.lineTo(x,yy);}ctx.lineTo(width+10,height);ctx.lineTo(-10,height);ctx.closePath();}
      function drawSky(){const g=ctx.createLinearGradient(0,0,0,height);if(isDark){g.addColorStop(0,'#070918');g.addColorStop(.34,'#111a34');g.addColorStop(.63,'#263c53');g.addColorStop(1,'#10272b');}else{g.addColorStop(0,'#8fd4f2');g.addColorStop(.34,'#c4eaf4');g.addColorStop(.62,'#f8dfc7');g.addColorStop(1,'#b9d5bd');}ctx.fillStyle=g;ctx.fillRect(0,0,width,height);const px=(mouse.x-.5)*20,py=(mouse.y-.5)*11;if(isDark){stars.forEach(s=>{const tw=.22+.78*(.5+.5*Math.sin(time*.001*s.tw+s.p));ctx.globalAlpha=tw*.78;ctx.fillStyle='#fff8df';ctx.beginPath();ctx.arc(s.x*width+px,s.y*height+py,s.r,0,6.28);ctx.fill();if(s.r>1){ctx.fillRect(s.x*width+px-2,s.y*height+py,.8,4);ctx.fillRect(s.x*width+px-2,s.y*height+py-2,4,.8);}});ctx.globalAlpha=1;const mx=width*.79+px,my=height*.15+py;ctx.shadowColor='rgba(255,236,185,.45)';ctx.shadowBlur=75;ctx.fillStyle='#fff0c7';ctx.beginPath();ctx.arc(mx,my,31,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#111a34';ctx.beginPath();ctx.arc(mx+12,my-8,25,0,6.28);ctx.fill();birds.forEach(b=>{b.x+=b.v;if(b.x>1.08)b.x=-.08;const x=b.x*width+px,y=b.y*height+py;ctx.strokeStyle='rgba(35,40,52,.5)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,5,Math.PI+.2,6.05);ctx.arc(x+8,y,5,Math.PI+.2,6.05);ctx.stroke();});}else{const sx=width*.82+px,sy=height*.13+py;ctx.shadowColor='rgba(255,190,85,.38)';ctx.shadowBlur=100;ctx.fillStyle='#ffe4a0';ctx.beginPath();ctx.arc(sx,sy,38,0,6.28);ctx.fill();ctx.shadowBlur=0;clouds.forEach(c=>{c.x+=c.s/60;if(c.x>1.3)c.x=-.3;const x=c.x*width+px,y=c.y*height+py;ctx.globalAlpha=c.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x,y,c.w*.5,c.h*.32,0,0,6.28);ctx.ellipse(x-c.w*.24,y+8,c.w*.3,c.h*.3,0,0,6.28);ctx.ellipse(x+c.w*.22,y+7,c.w*.28,c.h*.28,0,0,6.28);ctx.fill();});ctx.globalAlpha=1;}}
      function drawLandscape(){const p=mouse.x-.5;ctx.save();ctx.translate(p*8,0);hill(.47,.07,.2);ctx.fillStyle=isDark?'#26354b':'#91b29b';ctx.fill();ctx.restore();ctx.save();ctx.translate(p*15,0);hill(.55,.075,1.5);ctx.fillStyle=isDark?'#1b3138':'#638c6d';ctx.fill();ctx.restore();ctx.save();ctx.translate(p*23,0);hill(.64,.055,2.8);ctx.fillStyle=isDark?'#11272a':'#3f7057';ctx.fill();ctx.restore();const hg=ctx.createLinearGradient(0,height*.58,0,height*.72);hg.addColorStop(0,isDark?'rgba(150,180,205,.05)':'rgba(255,245,220,.20)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.fillRect(0,height*.54,width,height*.2);}
      function drawWater(){const top=height*.68;const g=ctx.createLinearGradient(0,top,0,height);g.addColorStop(0,isDark?'#294c5a':'#9bcbd0');g.addColorStop(.25,isDark?'#1e3e4c':'#72b2bd');g.addColorStop(1,isDark?'#091c25':'#3e7780');ctx.fillStyle=g;ctx.fillRect(0,top,width,height-top);for(let i=0;i<38;i++){const y=top+7+i*((height-top)/39);const amp=2+Math.sin(i*.7)*1.5;const wave=Math.sin(time*.0013+i*.55)*amp+Math.sin(time*.0007+i)*2;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(width*.22,y+wave,width*.48,y-wave,width*.72,y+wave*.4);ctx.bezierCurveTo(width*.84,y+wave*.7,width*.93,y-wave*.3,width,y+wave);ctx.strokeStyle=isDark?`rgba(187,219,225,${.025+(i%5)*.009})`:`rgba(255,250,225,${.045+(i%5)*.012})`;ctx.lineWidth=1;ctx.stroke();}const rx=width*(isDark?.79:.82), rg=ctx.createRadialGradient(rx,top+20,4,rx,top+70,210);rg.addColorStop(0,isDark?'rgba(255,237,190,.22)':'rgba(255,226,156,.27)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(rx-220,top,440,230);for(let i=0;i<11;i++){const x=(.06+i*.087)*width+Math.sin(time*.0008+i)*25,y=top+28+i*22+Math.sin(time*.001+i)*5;ctx.strokeStyle=isDark?'rgba(190,220,220,.10)':'rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(x,y,rand(10,25),2,0,0,6.28);ctx.stroke();}}
      function drawWindmill(){const x=width*.20+(mouse.x-.5)*28,y=height*.43+(mouse.y-.5)*6;ctx.save();ctx.translate(x,y);ctx.fillStyle=isDark?'rgba(255,230,190,.04)':'rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(0,0,55,0,6.28);ctx.fill();ctx.fillStyle=isDark?'#756f72':'#8f725c';ctx.beginPath();ctx.moveTo(-8,5);ctx.lineTo(8,5);ctx.lineTo(5,105);ctx.lineTo(-5,105);ctx.closePath();ctx.fill();ctx.fillStyle=isDark?'#c0b4ae':'#f4e5d0';ctx.fillRect(-12,27,24,4);ctx.fillRect(-10,53,20,4);ctx.fillRect(-7,79,14,4);ctx.fillStyle=isDark?'#4e4750':'#6f594d';ctx.beginPath();ctx.arc(0,0,9,0,6.28);ctx.fill();ctx.rotate(time*.00055);for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillStyle=isDark?'#9c949b':'#f8f1e7';ctx.beginPath();ctx.moveTo(-2,-7);ctx.lineTo(3,-7);ctx.lineTo(9,-76);ctx.lineTo(-8,-66);ctx.closePath();ctx.fill();}ctx.restore();}
      function drawVegetation(){reeds.forEach(r=>{const x=r.x*width+(mouse.x-.5)*18,y=r.y*height,s=Math.sin(time*.001+r.p)*4;ctx.strokeStyle=isDark?`rgba(70,105,76,${r.a})`:`rgba(47,104,67,${r.a})`;ctx.lineWidth=1.25;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+s,y-r.h*.45,x+s*1.4,y-r.h);ctx.stroke();});flowers.forEach(f=>{const x=f.x*width+(mouse.x-.5)*20*f.s, ground=f.y*height, sway=Math.sin(time*.0011+f.p)*3*f.s, top=ground-29*f.s;ctx.strokeStyle=isDark?'rgba(43,75,61,.9)':'rgba(55,105,68,.9)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,ground);ctx.quadraticCurveTo(x+sway,ground-15*f.s,x+sway*.4,top);ctx.stroke();ctx.save();ctx.translate(x+sway*.4, top);ctx.rotate(sway*.02);ctx.globalAlpha=.86;const col = `hsl(${f.h}, ${isDark?45:62}%, ${isDark?65:74}%)`;const colDark = `hsl(${f.h}, ${isDark?55:70}%, ${isDark?55:65}%)`;ctx.fillStyle = colDark; ctx.beginPath(); ctx.moveTo(0, -2*f.s); ctx.quadraticCurveTo(-8*f.s, -18*f.s, 0, -24*f.s); ctx.quadraticCurveTo(8*f.s, -18*f.s, 0, -2*f.s); ctx.fill();ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -4*f.s); ctx.quadraticCurveTo(-10*f.s, -12*f.s, -8*f.s, -20*f.s); ctx.quadraticCurveTo(-4*f.s, -24*f.s, 0, -16*f.s); ctx.fill();ctx.beginPath(); ctx.moveTo(0, -4*f.s); ctx.quadraticCurveTo(10*f.s, -12*f.s, 8*f.s, -20*f.s); ctx.quadraticCurveTo(4*f.s, -24*f.s, 0, -16*f.s); ctx.fill();ctx.fillStyle = colDark; ctx.beginPath(); ctx.moveTo(-4*f.s, -16*f.s); ctx.quadraticCurveTo(0, -26*f.s, 4*f.s, -16*f.s); ctx.quadraticCurveTo(2*f.s, -8*f.s, 0, -8*f.s); ctx.quadraticCurveTo(-2*f.s, -8*f.s, -4*f.s, -16*f.s); ctx.fill();ctx.restore();});}
      function drawButterflies(){if(isDark)return;butterflies.forEach(b=>{b.p+=.012;b.x+=b.vx+Math.sin(time*.0009+b.p)*.00008;b.y+=b.vy+Math.cos(time*.0012+b.p)*.00005;if(b.x<.03||b.x>.97)b.vx*=-1;if(b.y<.34||b.y>.70)b.vy*=-1;const x=b.x*width+(mouse.x-.5)*30,y=b.y*height+(mouse.y-.5)*14,flap=.72+.28*Math.sin(time*.02+b.p);ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(b.p)*.18);ctx.globalAlpha=.72;ctx.fillStyle=`hsl(${b.h},68%,76%)`;ctx.beginPath();ctx.ellipse(-4,-3,6,4.5*flap,-.35,0,6.28);ctx.ellipse(-4,3.5,5,3.5*flap,.35,0,6.28);ctx.ellipse(4,-3,6,4.5*flap,.35,0,6.28);ctx.ellipse(4,3.5,5,3.5*flap,-.35,0,6.28);ctx.fill();ctx.fillStyle='#63545b';ctx.fillRect(-1,-5,2,10);ctx.restore();});}
      function drawFireflies(){if(!isDark)return;fireflies.forEach(f=>{f.x+=f.vx+Math.sin(time*.0005+f.p)*.00008;f.y+=f.vy+Math.cos(time*.0008+f.p)*.00005;if(f.x<.01||f.x>.99)f.vx*=-1;if(f.y<.43||f.y>.93)f.vy*=-1;const glow=.25+.75*(.5+.5*Math.sin(time*.0027+f.p)),x=f.x*width,y=f.y*height;ctx.shadowColor='rgba(205,255,172,.8)';ctx.shadowBlur=15;ctx.fillStyle=`rgba(219,255,177,${.18+.72*glow})`;ctx.beginPath();ctx.arc(x,y,f.r*(.65+glow*.55),0,6.28);ctx.fill();ctx.shadowBlur=0;});}
      function drawMeteors(){if(!isDark)return;meteors.forEach(m=>{if(!m.active&&Math.random()<.0012){m.active=true;m.x=rand(.15,.9)*width;m.y=rand(.02,.30)*height;m.vx=rand(7,13);m.vy=rand(3,6);m.life=0;m.max=rand(28,55);}if(m.active){m.x+=m.vx;m.y+=m.vy;m.life++;const a=1-m.life/m.max;ctx.save();ctx.globalAlpha=Math.max(0,a);const grad=ctx.createLinearGradient(m.x-m.vx*7,m.y-m.vy*7,m.x,m.y);grad.addColorStop(0,'rgba(255,255,255,0)');grad.addColorStop(.75,'rgba(255,246,210,.35)');grad.addColorStop(1,'rgba(255,255,255,1)');ctx.strokeStyle=grad;ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*6,m.y-m.vy*6);ctx.stroke();ctx.restore();if(m.life>m.max)m.active=false;}});}
      function draw(){mouse.x=lerp(mouse.x,mouse.tx,.045);mouse.y=lerp(mouse.y,mouse.ty,.045);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);drawSky();drawLandscape();drawWater();drawWindmill();drawVegetation();drawButterflies();drawFireflies();drawMeteors();time+=16;raf=requestAnimationFrame(draw);}
      addEventListener('pointermove',e=>{mouse.tx=e.clientX/width;mouse.ty=e.clientY/height;},{passive:true});addEventListener('resize',resize);const observer=new MutationObserver(()=>{const d=document.body.classList.contains('dark');if(d!==isDark){isDark=d;init();}});observer.observe(document.body,{attributes:true,attributeFilter:['class']});resize();draw();
  })();
