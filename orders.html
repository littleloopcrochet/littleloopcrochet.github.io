  <style>
    :root{--bg:#fffdfb; --surface:#ffffff; --card:#fff9f8; --text:#000000; --text-soft:#222222; --muted:#444444; --accent:#d795a7; --accent-hover:#c98296; --pink:#f8dce4; --green:#dfeee5; --yellow:#f8edcc; --blue:#dceaf3; --nav-bg: transparent; --shadow:rgba(90,70,70,.10); --icon-glow:rgba(130,110,110,.18);}
    body.dark{--bg:#09070d; --surface:#110d17; --card:#17111f; --text:#f7effd; --text-soft:#c8b9d1; --muted:#9989a4; --accent:#bd7cff; --accent-hover:#d19cff; --pink:#352039; --green:#1b3028; --yellow:#342b18; --blue:#20243a; --nav-bg: transparent; --shadow:rgba(0,0,0,.45); --icon-glow:rgba(174,92,255,.75);}

    /* Nav Actions (always visible) */
    .nav-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
    
    .nav-right{display:flex;align-items:center;gap:28px} 
    .nav-links{display:flex;gap:30px;list-style:none;font-size:.9rem} 
    .nav-links a{display:inline-block;transition:color .3s ease,transform .3s ease}

    .signin-btn:hover{background:var(--accent-hover);transform:translateY(-3px);box-shadow:0 12px 25px rgba(215,149,167,.4)} 
    
    .theme-wrapper{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center} 
    .theme-toggle{width:46px;height:46px;border:1px solid rgba(120,100,120,.12);border-radius:50%;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.15rem;position:relative;z-index:5;transition:transform .4s ease,background .5s ease,color .5s ease,box-shadow .5s ease} 
    .theme-toggle:hover{transform:translateY(-3px) scale(1.08);box-shadow:0 0 20px var(--icon-glow)} 

    .mute-wrapper { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    .mute-toggle { width: 38px; height: 38px; border: 1px solid rgba(120,100,120,.12); border-radius: 50%; background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; position: relative; z-index: 5; transition: transform .4s ease, background .5s ease, color .5s ease, box-shadow .5s ease; }
    .mute-toggle:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 0 20px var(--icon-glow); }
    body.dark .mute-toggle { border-color: rgba(194,130,255,.3); }
    body.dark .mute-toggle:hover { border-color: rgba(194,130,255,.45); box-shadow: 0 0 12px rgba(180,100,255,.45); }

    /* ===== HAMBURGER MENU (Mobile Only) ===== */
    .hamburger{
      display:none;
      flex-direction:column;
      justify-content:space-between;
      width:30px;
      height:22px;
      background:none;
      border:none;
      cursor:pointer;
      z-index: 10002;

    .hamburger span{
      display:block;
      width:100%;
      height:3px;
      background:var(--text);
      border-radius:3px;
      transition: all .3s ease;
    }
    
    /* ===== RESPONSIVE NAVIGATION (Mobile) ===== */

        align-items:flex-end;

        right:0;

        padding:80px 20px;
        box-shadow:-5px 0 20px rgba(0,0,0,0.2);

    .order-actions { display: flex; gap: 10px; } 
    .order-actions a, .order-actions button { padding: 8px 15px; border-radius: 50px; background: var(--accent); color: white; font-size: .85rem; font-weight: 600; border: none; cursor: pointer; transition: background .3s ease; } 
    .order-actions a:hover, .order-actions button:hover { background: var(--accent-hover); } 
    .order-actions .cancel-btn { background: #ff6b6b; } 
    .order-actions .cancel-btn:hover { background: #e55353; } 
    .order-actions .edit-btn { background: var(--blue); color: white; } 
    .order-actions .edit-btn:hover { background: var(--blue); opacity: 0.8; } 
    .empty-orders { text-align: center; padding: 80px 20px; } 
    .empty-orders h2 { font-size: 1.8rem; margin-bottom: 15px; color: var(--text); } 
    .empty-orders p { color: var(--muted); margin-bottom: 30px; } 
    .shop-btn { padding: 15px 30px; background: var(--accent); color: white; border-radius: 50px; text-decoration: none; font-weight: 600; transition: background .3s ease; display: inline-block; } 
    .shop-btn:hover { background: var(--accent-hover); } 
    .order-status.refunded { background: var(--blue); color: #1e4e6a; }
    
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; } 
    .modal-box { background: var(--card); padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; position: relative; text-align: center; } 
    .close-modal { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: var(--muted); } 
    .timeline { display: flex; justify-content: space-between; margin-top: 30px; position: relative; } 
    .timeline::before { content: ""; position: absolute; top: 10px; left: 10%; right: 10%; height: 4px; background: var(--muted); opacity: 0.3; } 
    .step { position: relative; z-index: 1; width: 20%; text-align: center; } 
    .step-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--muted); margin: 0 auto 10px; opacity: 0.5; } 
    .step.active .step-dot { background: var(--accent); opacity: 1; box-shadow: 0 0 10px var(--accent); } 
    .step-label { font-size: 0.8rem; color: var(--muted); } 
    .step.active .step-label { color: var(--accent); font-weight: bold; }

    body.is-loading{overflow:hidden} 
    .page-loader{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .7s ease,visibility .7s ease} 
    .page-loader.loaded{opacity:0;visibility:hidden;pointer-events:none} 
    .loader-backdrop{position:absolute;inset:0;background:rgba(255,253,251,.58);backdrop-filter:blur(7px);transition:background .6s ease} 
    body.dark .loader-backdrop{background:rgba(7,4,11,.64)} 
    .loader-card{position:relative;width:min(350px, 90vw);max-width:390px;max-height:80vh;overflow:auto;padding:24px;border:1px solid rgba(190,150,175,.18);border-radius:30px;background:rgba(255,255,255,.88);box-shadow:0 25px 80px rgba(80,55,75,.18);backdrop-filter:blur(20px);text-align:center;animation:loaderCardFloat 4s ease-in-out infinite} 
    body.dark .loader-card{background:rgba(24,16,32,.92);border-color:rgba(190,120,255,.22);box-shadow:0 25px 90px rgba(0,0,0,.55)} 
    @keyframes loaderCardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} 
    .loader-copy{margin-bottom:22px}.loader-title{color:var(--text);font-size:1rem;font-weight:700}.loader-subtitle{color:var(--muted);font-size:.7rem} 
    .yarn-loader{position:relative;width:100%;padding:0 7px}.yarn-track{height:18px;border-radius:20px;background:rgba(215,149,167,.17);overflow:hidden;box-shadow:inset 0 2px 6px rgba(80,50,70,.08)} 
    .yarn-progress{position:relative;height:100%;width:0;border-radius:20px;background:var(--accent);transition:width .35s cubic-bezier(.22,.61,.36,1)} 
    .yarn-ends{display:flex;justify-content:space-between;margin-top:-4px}.yarn-ends span{font-size:17px;animation:yarnBounce 1.6s ease-in-out infinite} 
    @keyframes yarnBounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-3px) rotate(5deg)}} 
    .loader-percent{margin-top:13px;color:var(--accent);font-size:.68rem;font-weight:700}
    
    body{position:relative;isolation:isolate;width:100%;overflow-x:hidden} 
    #aboutCanvas{position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;z-index:-2 !important;pointer-events:none !important;display:block} 
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.12),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.05))} 
    nav,.orders-page,footer{position:relative;z-index:2}
    
    .magic-particles{position:fixed;pointer-events:none;z-index:9999;width:1px;height:1px;} 
    .butterfly{position:fixed;width:18px;height:18px;pointer-events:none;opacity:0;animation:butterflyDrift 4.8s cubic-bezier(.25,.65,.35,1) forwards;filter:drop-shadow(0 2px 4px rgba(180,120,160,.18));} 
    .butterfly .body{position:absolute;left:50%;top:50%;width:3px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:#7d6877;z-index:3;} 
    .butterfly .wing{position:absolute;top:3px;width:8px;height:11px;border-radius:80% 20% 70% 30%;background:linear-gradient(135deg,#f6c5d9,#d9a7d7);transform-origin:center right;} 
    .butterfly .wing.left{right:50%;transform:rotate(-25deg) scaleX(1);animation:flapLeft .48s ease-in-out infinite alternate;} 
    .butterfly .wing.right{left:50%;border-radius:20% 80% 30% 70%;transform:rotate(25deg) scaleX(1);animation:flapRight .48s ease-in-out infinite alternate;} 
    @keyframes flapLeft{from{transform:rotate(-25deg) scaleX(1)}to{transform:rotate(-10deg) scaleX(.48)}} 
    @keyframes flapRight{from{transform:rotate(25deg) scaleX(1)}to{transform:rotate(10deg) scaleX(.48)}} 
    @keyframes butterflyDrift{0%{opacity:0;transform:translate(0,7px) rotate(-8deg) scale(.55)}10%{opacity:.18}24%{opacity:.82;transform:translate(var(--x1),var(--y1)) rotate(5deg) scale(.88)}45%{opacity:.95;transform:translate(var(--x2),var(--y2)) rotate(-5deg) scale(1)}68%{opacity:.78;transform:translate(var(--x3),var(--y3)) rotate(7deg) scale(.92)}84%{opacity:.35;transform:translate(var(--x4),var(--y4)) rotate(-4deg) scale(.72)}100%{opacity:0;transform:translate(calc(var(--x4) * 1.08),calc(var(--y4) - 8px)) rotate(2deg) scale(.5)}} 
    .firefly{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;background:#e1b8ff;box-shadow:0 0 5px #d19cff,0 0 12px #b86aff,0 0 23px rgba(168,80,255,.8);opacity:0;animation:fireflyDrift 3.8s ease-in-out forwards;} 
    @keyframes fireflyDrift{0%{opacity:0;transform:translate(0,5px) scale(.25)}12%{opacity:.18}28%{opacity:.72;transform:translate(var(--x1),var(--y1)) scale(.75)}46%{opacity:1;transform:translate(var(--x2),var(--y2)) scale(1)}62%{opacity:.72;transform:translate(var(--x3),var(--y3)) scale(.85)}82%{opacity:.35;transform:translate(var(--x4),var(--y4)) scale(.62)}100%{opacity:0;transform:translate(calc(var(--x4) * 1.05),calc(var(--y4) - 7px)) scale(.2)}} 
    body.dark .magic-hover:hover{filter:drop-shadow(0 0 7px rgba(189,124,255,.5));} 
    .heart-bubble{position:fixed;pointer-events:none;z-index:10000;font-size:13px;opacity:0;animation:heartBubble 1.25s cubic-bezier(.2,.7,.3,1) forwards;} 
    @keyframes heartBubble{0%{opacity:0;transform:translate(0,5px) scale(.25) rotate(-12deg)}15%{opacity:1;transform:translate(0,0) scale(.85) rotate(5deg)}45%{transform:translate(var(--heart-x),-24px) scale(1) rotate(-8deg)}75%{opacity:.85;transform:translate(calc(var(--heart-x) * .7),-45px) scale(.85) rotate(9deg)}100%{opacity:0;transform:translate(calc(var(--heart-x) * 1.4),-70px) scale(.05) rotate(-15deg)}} 
    footer{padding:35px 7%;text-align:center;background:transparent;color:var(--muted);font-size:.8rem; position: relative; z-index: 2;} 
    
    @media(max-width:750px){
      nav{padding:20px 6%}
      .orders-page{padding: 50px 6%;}
      .orders-title{font-size: 1.8rem}
      .order-actions{width:100%;justify-content:flex-end}
      .loader-card{width:90vw;padding:20px;max-height:90vh;}
    }
  </style>

<script>
  const firebaseConfig = { apiKey: "AIzaSyCeiXIZhofwxkUrWkowZuiMSHyRcsfeHE0", authDomain: "littleloopcrochet-2dcdf.firebaseapp.com", projectId: "littleloopcrochet-2dcdf", storageBucket: "littleloopcrochet-2dcdf.firebasestorage.app", messagingSenderId: "837032344744", appId: "1:837032344744:web:41f17ab83bb6071240969d", measurementId: "G-1F2GVL84HC" };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const pageLoader = document.getElementById('pageLoader'); const progressBar = document.querySelector('.yarn-progress'); const percentDisplay = document.getElementById('loaderPercent');
  let progress = 0, finished = false; const startTime = performance.now(); const MIN_LOAD_TIME = 500;
  
  function setProgress(value) { progress = Math.max(progress, Math.min(100, value)); progressBar.style.width = progress + '%'; percentDisplay.textContent = Math.round(progress) + '%'; }
  const ticker = setInterval(function() { if(finished) return; if(progress < 95) { setProgress(progress + Math.max(0.5, (95 - progress) * 0.04)); } }, 80);
  function finishLoading() { if(finished) return; finished = true; const wait = Math.max(0, MIN_LOAD_TIME - (performance.now() - startTime)); setTimeout(function(){ clearInterval(ticker); setProgress(100); setTimeout(function(){ pageLoader.classList.add('loaded'); document.body.classList.remove('is-loading'); setTimeout(() => pageLoader.remove(), 750); }, 400); }, wait); }
  
  // Loader finishes only when orders are loaded (or user not signed in)
  window.finishLoading = finishLoading;

  // ===== HAMBURGER MENU LOGIC =====
  window.toggleMenu = function() {
    const navRight = document.getElementById('navRight');
    navRight.classList.toggle('open');
  };

  const authButtonText = document.getElementById('authButtonText');
  let currentUser = null;

  // Time windows
  const CANCEL_WINDOW_MS = 24 * 60 * 60 * 1000;
  const EDIT_WINDOW_MS = 24 * 60 * 60 * 1000;

  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    if (user) {
      authButtonText.textContent = user.displayName || user.phoneNumber || 'Account';
      loadOrders();
    } else {
      authButtonText.textContent = 'Sign In';
      document.getElementById('ordersContainer').innerHTML = `<div class="empty-orders" style="width:100%;"><h2>Please Sign In</h2><p>You need to sign in to view your orders.</p><a href="index.html" class="shop-btn">Go to Sign In</a></div>`;
      window.finishLoading();
    }
  });

  function loadOrders() {
    if (!currentUser) return;
    const container = document.getElementById('ordersContainer'); container.innerHTML = '';
    
    db.collection('orders').where('userId', '==', currentUser.uid).get().then(function(querySnapshot) {
      if (querySnapshot.empty) { 
        container.innerHTML = `<div class="empty-orders" style="width:100%;"><h2>No orders yet!</h2><p>Once you place an order, it will show up here.</p><a href="shop.html" class="shop-btn">Start Shopping</a></div>`; 
        window.finishLoading(); return; 
      }

      let orders = [];
      querySnapshot.forEach(function(doc) {
        let order = doc.data();
        order.id = doc.id;
        orders.push(order);
      });

      orders.sort((a, b) => {
        let dateA = a.createdAt ? a.createdAt.toDate() : new Date(0);
        let dateB = b.createdAt ? b.createdAt.toDate() : new Date(0);
        return dateB - dateA;
      });

      orders.forEach(function(order) {
        const orderId = order.id;
        const dateObj = order.createdAt ? order.createdAt.toDate() : new Date();
        const dateStr = dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        const status = order.status || 'pending';
        let statusClass = 'pending';
        if (status === 'paid') statusClass = 'paid'; if (status === 'shipped') statusClass = 'shipped'; if (status === 'delivered') statusClass = 'delivered'; if (status === 'cancelled') statusClass = 'cancelled'; if (status === 'refunded') statusClass = 'refunded';
        let itemsHTML = '';
        if (order.items && order.items.length > 0) { order.items.forEach(function(item) { const isValidImage = item.image && item.image !== '🧸'; const img = isValidImage ? `<img src="${item.image}" alt="${item.name}">` : `<span>🧸</span>`; itemsHTML += `<div class="item-row"><div class="item-img">${img}</div><div class="item-name">${item.name}</div><div class="item-qty">x ${item.quantity}</div><div class="item-price">₹${item.price * item.quantity}</div></div>`; }); } else { itemsHTML = `<div class="item-row">No items found</div>`; }
        
        const now = new Date();
        const createdDate = order.createdAt ? order.createdAt.toDate() : new Date();
        const timeDiff = now - createdDate;

        let cancelBtn = '';
        if (timeDiff < CANCEL_WINDOW_MS && status !== 'cancelled' && status !== 'delivered' && status !== 'refunded') {
          cancelBtn = `<button onclick="cancelOrder('${orderId}')" class="cancel-btn">Cancel</button>`;
        }

        let trackBtn = '';
        if (status === 'shipped') {
          trackBtn = `<button onclick="openTrackModal('${status}')">Track</button>`;
        }

        let editBtn = '';
        if (timeDiff < EDIT_WINDOW_MS && status !== 'cancelled' && status !== 'refunded' && status !== 'delivered') {
          editBtn = `<button onclick="openEditModal('${orderId}')" class="edit-btn">Edit Order Details</button>`;
        }
        
        const cardHTML = `<div class="order-card"><div class="order-header"><h3>Order #${orderId.slice(-6).toUpperCase()}</h3><span class="order-status ${statusClass}">${status}</span><span class="order-date">${dateStr}</span></div><div class="order-items"><h4>Items</h4>${itemsHTML}</div><div class="order-summary"><div><span class="order-total-label">Total</span><div class="order-total-amount">₹${order.total || 0}</div></div><div class="order-actions">${trackBtn}${cancelBtn}${editBtn}<a href="shop.html">Shop</a></div></div></div>`;
        container.innerHTML += cardHTML;
      });
      window.finishLoading();
    }).catch(function(err) { console.error("Error loading orders: ", err); container.innerHTML = `<div class="empty-orders" style="width:100%;"><h2>Error loading orders</h2><p>Please refresh the page.</p></div>`; window.finishLoading(); });
  }

  window.cancelOrder = async function(orderId) {
    if (!confirm('Are you sure you want to cancel this order?')) return;
    db.collection('orders').doc(orderId).update({ status: 'cancelled' }).then(async () => {
      alert('Order cancelled successfully.');
      loadOrders();
      const orderDoc = await db.collection('orders').doc(orderId).get();
      const order = orderDoc.data();
      const email = order.email || '';
      if (email) {
        fetch('https://little-loop-payments.mayankverma01092003.workers.dev/api/send-status-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: orderId, status: 'cancelled', customerUid: currentUser.uid, email: email, name: order.userName || 'Customer', total: order.total || 0 })
        }).catch(err => console.error("Auto email failed:", err));
      }
    }).catch(function(error) {
      console.error("Error cancelling order: ", error);
      alert('Could not cancel order. Please contact support.');
    });
  };

  window.openEditModal = function(orderId) {
    db.collection('orders').doc(orderId).get().then((doc) => {
      const order = doc.data();
      const name = prompt("Enter new name:", order.userName);
      if (name === null) return;
      const phone = prompt("Enter new phone:", order.phone);
      if (phone === null) return;
      const address = prompt("Enter new address:", order.address);
      db.collection('orders').doc(orderId).update({ userName: name, phone: phone, address: address }).then(() => {
        alert("Order details updated!");
        loadOrders();
      }).catch((err) => { console.error("Edit error:", err); alert("Could not edit order."); });
    });
  };

  window.openTrackModal = function(status) {
    const timeline = document.getElementById('trackTimeline');
    let activeIndex = 0;
    if (status === 'pending') activeIndex = 0; if (status === 'paid') activeIndex = 1; if (status === 'shipped') activeIndex = 2; if (status === 'delivered') activeIndex = 3; if (status === 'cancelled') activeIndex = -1;
    timeline.innerHTML = `<div class="step ${activeIndex >= 0 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Pending</div></div><div class="step ${activeIndex >= 1 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Paid</div></div><div class="step ${activeIndex >= 2 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Shipped</div></div><div class="step ${activeIndex >= 3 ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">Delivered</div></div>`;
    if (status === 'cancelled') { timeline.innerHTML = `<div style="color: #ff6b6b; font-weight: bold;">This order has been cancelled.</div>`; }
    if (status === 'refunded') { timeline.innerHTML = `<div style="color: var(--blue); font-weight: bold;">This order has been refunded. If you haven't received your money yet, please contact support.</div>`; }
    document.getElementById('trackModal').style.display = 'flex';
  };

  window.closeTrackModal = function() { document.getElementById('trackModal').style.display = 'none'; };

<script>
(function() {
  const audioManager = {
    muted: false, currentTheme: null, audioElements: [], config: null, started: false,
    defaultConfig: { day: { tracks: [{ src: 's1d.mp3', volume: 0.5 }, { src: 's2d.mp3', volume: 0.3 }]}, night: { tracks: [{ src: 's1n.mp3', volume: 0.5 }, { src: 's2n.mp3', volume: 0.5 }]}},
    async init() { const paths = ['sound-config.json', './sound-config.json', '/sound-config.json']; for (const path of paths) { try { const res = await fetch(path, { cache: 'no-store' }); if (res.ok) { this.config = await res.json(); console.log(`✅ Loaded config from ${path}`); break; } else { console.warn(`❌ ${path} returned status ${res.status}`); } } catch (e) { console.warn(`❌ Failed to fetch ${path}: ${e.message}`); } } if (!this.config) { console.warn('⚠️ Using fallback config – edit volumes below.'); this.config = this.defaultConfig; } this.currentTheme = document.body.classList.contains('dark') ? 'night' : 'day'; this.setupMuteButton(); this.loadMuteState(); this.armStart(); this.bindThemeChange(); },
    armStart() { const startAudio = () => { if (this.started) return; this.started = true; this.startThemeAudio(this.currentTheme); document.removeEventListener('click', startAudio); document.removeEventListener('keydown', startAudio); document.removeEventListener('touchstart', startAudio); document.removeEventListener('pointerdown', startAudio); }; document.addEventListener('click', startAudio); document.addEventListener('keydown', startAudio); document.addEventListener('touchstart', startAudio); document.addEventListener('pointerdown', startAudio); },
    setupMuteButton() { const muteBtn = document.getElementById('muteToggle'); const muteIcon = document.getElementById('muteIcon'); if (!muteBtn) return; muteBtn.addEventListener('click', () => { this.toggleMute(); }); },
    toggleMute() { this.muted = !this.muted; const icon = document.getElementById('muteIcon'); if (icon) icon.textContent = this.muted ? '🔇' : '🔊'; this.audioElements.forEach(audio => { audio.muted = this.muted; }); localStorage.setItem('audioMuted', this.muted ? '1' : '0'); },
    loadMuteState() { const saved = localStorage.getItem('audioMuted'); this.muted = saved === '1'; const icon = document.getElementById('muteIcon'); if (icon) icon.textContent = this.muted ? '🔇' : '🔊'; },
    bindThemeChange() { const toggle = document.getElementById('themeToggle'); if (!toggle) return; toggle.addEventListener('click', () => { this.switchTheme(document.body.classList.contains('dark') ? 'night' : 'day'); }); },
    switchTheme(newTheme) { if (this.currentTheme === newTheme) return; const oldTheme = this.currentTheme; this.currentTheme = newTheme; if (this.started) this.crossfade(oldTheme, newTheme); },
