<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Little Loop Crochet</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== All existing styles (Same as Index/About) ===== */
    :root{
      --bg:#fffdfb; --surface:#ffffff; --card:#fff9f8; --text:#000000;
      --text-soft:#222222; --muted:#444444; --accent:#d795a7; --accent-hover:#c98296;
      --pink:#f8dce4; --green:#dfeee5; --yellow:#f8edcc; --blue:#dceaf3;
      --nav-bg: transparent; --shadow:rgba(90,70,70,.10); --icon-glow:rgba(130,110,110,.18);
    }
    body.dark{
      --bg:#09070d; --surface:#110d17; --card:#17111f; --text:#f7effd;
      --text-soft:#c8b9d1; --muted:#9989a4; --accent:#bd7cff; --accent-hover:#d19cff;
      --pink:#352039; --green:#1b3028; --yellow:#342b18; --blue:#20243a;
      --nav-bg: transparent; --shadow:rgba(0,0,0,.45); --icon-glow:rgba(174,92,255,.75);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      font-family:"Comfortaa",sans-serif; background:transparent; color:var(--text);
      line-height:1.6; transition:background .5s ease,color .5s ease; overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    
    /* Navigation */
    nav{width:100%;padding:22px 7%;display:flex;justify-content:space-between;align-items:center;background:var(--nav-bg);position:sticky;top:0;z-index:1000;transition:background .5s ease}
    nav a, nav .logo, .nav-links a { text-shadow: 0 1px 3px rgba(255,255,255,0.6); }
    body.dark nav a, body.dark nav .logo, body.dark .nav-links a { text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .logo{font-size:1.35rem;font-weight:700;color:var(--text);transition:transform .3s ease,color .3s ease}
    .logo:hover{transform:translateY(-2px);color:var(--accent)}
    .nav-right{display:flex;align-items:center;gap:28px}
    .nav-links{display:flex;gap:30px;list-style:none;font-size:.9rem}
    .nav-links a{display:inline-block;transition:color .3s ease,transform .3s ease}
    .nav-links a:hover{color:var(--accent);transform:translateY(-2px)}
    .signin-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:50px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;border:none;cursor:pointer;transition:background .3s ease, transform .3s ease, box-shadow .3s ease;text-shadow:none;box-shadow:0 8px 20px rgba(215,149,167,.3)}
    .signin-btn:hover{background:var(--accent-hover);transform:translateY(-3px);box-shadow:0 12px 25px rgba(215,149,167,.4)}
    .theme-wrapper{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
    .theme-toggle{width:46px;height:46px;border:1px solid rgba(120,100,120,.12);border-radius:50%;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.15rem;position:relative;z-index:5;transition:transform .4s ease,background .5s ease,color .5s ease,box-shadow .5s ease}
    .theme-toggle:hover{transform:translateY(-3px) scale(1.08);box-shadow:0 0 20px var(--icon-glow)}

    /* ===== CART PAGE SPECIFIC STYLES ===== */
    .cart-page { min-height: 90vh; padding: 100px 7%; max-width: 1200px; margin: 0 auto; }
    .cart-title { text-align: center; font-size: 2.5rem; margin-bottom: 40px; color: var(--text); text-shadow: 0 1px 3px rgba(255,255,255,0.6); }
    body.dark .cart-title { text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .cart-container { display: flex; gap: 30px; flex-wrap: wrap; }
    .cart-items { flex: 2; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
    
    .cart-item { display: flex; align-items: center; gap: 20px; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 5px 15px var(--shadow); transition: transform .3s ease; }
    .cart-item:hover { transform: translateY(-3px); }
    .cart-item-img { width: 80px; height: 80px; background: var(--pink); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 3rem; overflow: hidden; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-details { flex: 1; }
    .cart-item-details h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 5px; }
    .cart-item-details p { font-size: .9rem; color: var(--muted); }
    .cart-item-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .cart-item-price { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
    .qty-btn:hover { background: var(--accent-hover); }
    .qty-display { font-size: 1.1rem; font-weight: 600; min-width: 30px; text-align: center; }
    .remove-btn { background: none; border: none; cursor: pointer; color: #ff6b6b; font-size: .9rem; font-weight: 600; }
    .remove-btn:hover { text-decoration: underline; }

    /* Summary & Checkout */
    .cart-summary { flex: 1; min-width: 300px; background: var(--card); border-radius: 30px; padding: 30px; height: fit-content; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 20px 60px var(--shadow); position: relative; }
    .summary-title { font-size: 1.5rem; color: var(--text); margin-bottom: 20px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-soft); }
    .summary-row.total { font-size: 1.5rem; font-weight: bold; color: var(--text); border-top: 1px solid rgba(120,100,120,.2); padding-top: 20px; margin-top: 10px; }
    
    /* Continue Shopping button */
    .continue-shopping { display: inline-block; margin-top: 20px; padding: 12px 25px; background: var(--accent); color: white; border-radius: 50px; text-decoration: none; font-weight: 600; transition: background .3s ease; text-align: center; width: 100%; box-sizing: border-box; }
    .continue-shopping:hover { background: var(--accent-hover); }
    
    .checkout-form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: .9rem; color: var(--text-soft); }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid rgba(120,100,120,.2); border-radius: 10px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 1rem; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    
    .checkout-btn { width: 100%; padding: 15px; border: none; border-radius: 50px; background: var(--accent); color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform .3s ease, background .3s ease; }
    .checkout-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    
    /* Empty Cart */
    .empty-cart { text-align: center; padding: 60px 20px; }
    .empty-cart h2 { font-size: 2rem; margin-bottom: 20px; color: var(--text); }
    .empty-cart p { color: var(--muted); margin-bottom: 30px; }
    .shop-btn { padding: 15px 30px; background: var(--accent); color: white; border-radius: 50px; text-decoration: none; font-weight: 600; transition: background .3s ease; display: inline-block; }
    .shop-btn:hover { background: var(--accent-hover); }

    /* Confetti (for summary) */
    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 50;
    }
    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confettiFall 2.5s ease-in forwards;
    }
    @keyframes confettiFall {
      0% { top: 10%; opacity: 1; transform: rotate(0deg); }
      100% { top: 95%; opacity: 0; transform: rotate(360deg); }
    }

    /* Footer */
    footer{padding:35px 7%;text-align:center;background:transparent;color:var(--muted);font-size:.8rem; position: relative; z-index: 2;}

    /* Loader */
    body.is-loading{overflow:hidden}
    body.is-loading > *:not(#pageLoader){filter:blur(7px);transform:scale(.997);transition:filter .5s ease,transform .5s ease}
    .page-loader{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .7s ease,visibility .7s ease}
    .page-loader.loaded{opacity:0;visibility:hidden;pointer-events:none}
    .loader-backdrop{position:absolute;inset:0;background:rgba(255,253,251,.58);backdrop-filter:blur(3px);transition:background .6s ease}
    body.dark .loader-backdrop{background:rgba(7,4,11,.64)}
    .loader-card{position:relative;width:min(390px,calc(100vw - 38px));padding:28px;border:1px solid rgba(190,150,175,.18);border-radius:30px;background:rgba(255,255,255,.88);box-shadow:0 25px 80px rgba(80,55,75,.18);backdrop-filter:blur(20px);text-align:center;animation:loaderCardFloat 4s ease-in-out infinite}
    body.dark .loader-card{background:rgba(24,16,32,.92);border-color:rgba(190,120,255,.22);box-shadow:0 25px 90px rgba(0,0,0,.55)}
    @keyframes loaderCardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .loader-copy{margin-bottom:22px}.loader-title{color:var(--text);font-size:1rem;font-weight:700}.loader-subtitle{color:var(--muted);font-size:.7rem}
    .yarn-loader{position:relative;width:100%;padding:0 7px}.yarn-track{height:18px;border-radius:20px;background:rgba(215,149,167,.17);overflow:hidden;box-shadow:inset 0 2px 6px rgba(80,50,70,.08)}
    .yarn-progress{position:relative;height:100%;width:0;border-radius:20px;background:var(--accent);transition:width .35s cubic-bezier(.22,.61,.36,1)}
    .yarn-ends{display:flex;justify-content:space-between;margin-top:-4px}.yarn-ends span{font-size:17px;animation:yarnBounce 1.6s ease-in-out infinite}
    @keyframes yarnBounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-3px) rotate(5deg)}}
    .loader-percent{margin-top:13px;color:var(--accent);font-size:.68rem;font-weight:700}

    /* Background & Z-index */
    body{position:relative;isolation:isolate}
    #aboutCanvas{position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;z-index:-2 !important;pointer-events:none !important;display:block}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.12),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.05))}
    nav,.cart-page,footer{position:relative;z-index:2}

    /* Magic Particles & Hearts */
    .magic-particles{position:fixed;pointer-events:none;z-index:9999;width:1px;height:1px;}
    .butterfly{position:fixed;width:18px;height:18px;pointer-events:none;opacity:0;animation:butterflyDrift 4.8s cubic-bezier(.25,.65,.35,1) forwards;filter:drop-shadow(0 2px 4px rgba(180,120,160,.18));}
    .butterfly .body{position:absolute;left:50%;top:50%;width:3px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:#7d6877;z-index:3;}
    .butterfly .wing{position:absolute;top:3px;width:8px;height:11px;border-radius:80% 20% 70% 30%;background:linear-gradient(135deg,#f6c5d9,#d9a7d7);transform-origin:center right;}
    .butterfly .wing.left{right:50%;transform:rotate(-25deg) scaleX(1);animation:flapLeft .48s ease-in-out infinite alternate;}
    .butterfly .wing.right{left:50%;border-radius:20% 80% 30% 70%;transform:rotate(25deg) scaleX(1);animation:flapRight .48s ease-in-out infinite alternate;}
    @keyframes flapLeft{from{transform:rotate(-25deg) scaleX(1)}to{transform:rotate(-10deg) scaleX(.48)}}
    @keyframes flapRight{from{transform:rotate(25deg) scaleX(1)}to{transform:rotate(10deg) scaleX(.48)}}
    @keyframes butterflyDrift{0%{opacity:0;transform:translate(0,7px) rotate(-8deg) scale(.55)}10%{opacity:.18}24%{opacity:.82;transform:translate(var(--x1),var(--y1)) rotate(5deg) scale(.88)}45%{opacity:.95;transform:translate(var(--x2),var(--y2)) rotate(-5deg) scale(1)}68%{opacity:.78;transform:translate(var(--x3),var(--y3)) rotate(7deg) scale(.92)}84%{opacity:.35;transform:translate(var(--x4),var(--y4)) rotate(-4deg) scale(.72)}100%{opacity:0;transform:translate(calc(var(--x4) * 1.08),calc(var(--y4) - 8px)) rotate(2deg) scale(.5)}}
    .firefly{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;background:#e1b8ff;box-shadow:0 0 5px #d19cff,0 0 12px #b86aff,0 0 23px rgba(168,80,255,.8);opacity:0;animation:fireflyDrift 3.8s ease-in-out forwards;}
    @keyframes fireflyDrift{0%{opacity:0;transform:translate(0,5px) scale(.25)}12%{opacity:.18}28%{opacity:.72;transform:translate(var(--x1),var(--y1)) scale(.75)}46%{opacity:1;transform:translate(var(--x2),var(--y2)) scale(1)}62%{opacity:.72;transform:translate(var(--x3),var(--y3)) scale(.85)}82%{opacity:.35;transform:translate(var(--x4),var(--y4)) scale(.62)}100%{opacity:0;transform:translate(calc(var(--x4) * 1.05),calc(var(--y4) - 7px)) scale(.2)}}
    body.dark .magic-hover:hover{filter:drop-shadow(0 0 7px rgba(189,124,255,.5));}
    .heart-bubble{position:fixed;pointer-events:none;z-index:10000;font-size:13px;opacity:0;animation:heartBubble 1.25s cubic-bezier(.2,.7,.3,1) forwards;}
    @keyframes heartBubble{0%{opacity:0;transform:translate(0,5px) scale(.25) rotate(-12deg)}15%{opacity:1;transform:translate(0,0) scale(.85) rotate(5deg)}45%{transform:translate(var(--heart-x),-24px) scale(1) rotate(-8deg)}75%{opacity:.85;transform:translate(calc(var(--heart-x) * .7),-45px) scale(.85) rotate(9deg)}100%{opacity:0;transform:translate(calc(var(--heart-x) * 1.4),-70px) scale(.05) rotate(-15deg)}}

    @media(max-width:750px){
      nav{padding:20px 6%}.nav-right{gap:15px}.nav-links{gap:15px;font-size:.75rem}
      .cart-page{padding: 60px 6%}.cart-title{font-size: 2rem}
    }
  </style>
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
</head>

<body class="is-loading">
<canvas id="aboutCanvas" aria-hidden="true"></canvas>

<!-- Loader -->
<div id="pageLoader" class="page-loader">
  <div class="loader-backdrop"></div>
  <div class="loader-card">
    <div class="loader-copy"><span class="loader-title">Loading your cart...</span></div>
    <div class="yarn-loader"><div class="yarn-track"><div class="yarn-progress"></div></div><div class="yarn-ends"><span>🧶</span><span>🧶</span></div></div>
    <div class="loader-percent" id="loaderPercent">0%</div>
  </div>
</div>

<!-- Navigation -->
<nav>
  <a href="index.html" class="logo magic-hover">♡ Little Loop</a>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="index.html" class="magic-hover">Home</a></li>
      <li><a href="shop.html" class="magic-hover">Shop</a></li>
      <li><a href="cart.html" class="magic-hover">Cart</a></li>
      <li><a href="about.html" class="magic-hover">About</a></li>
      <li><a href="contact.html" class="magic-hover">Contact</a></li>
    </ul>
    
    <!-- Auth Button -->
    <button class="signin-btn" id="authButton" onclick="window.location.href='index.html'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span id="authButtonText">Account</span>
    </button>
    
    <div class="theme-wrapper magic-hover">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme"><span class="theme-icon" id="themeIcon">☀️</span></button>
    </div>
  </div>
</nav>

<!-- Cart Page -->
<div class="cart-page">
  <h1 class="cart-title">Your Cart</h1>
  <div id="cartContent" class="cart-container"></div>
</div>

<!-- Standard Footer -->
<footer>
  <p>♡ Little Loop Crochet</p>
  <p>Made by hand · Made with love</p>
</footer>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCeiXIZhofwxkUrWkowZuiMSHyRcsfeHE0",
    authDomain: "littleloopcrochet-2dcdf.firebaseapp.com",
    projectId: "littleloopcrochet-2dcdf",
    storageBucket: "littleloopcrochet-2dcdf.firebasestorage.app",
    messagingSenderId: "837032344744",
    appId: "1:837032344744:web:41f17ab83bb6071240969d",
    measurementId: "G-1F2GVL84HC"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ===== Loader =====
  const pageLoader = document.getElementById('pageLoader');
  const progressBar = document.querySelector('.yarn-progress');
  const percentDisplay = document.getElementById('loaderPercent');
  let progress = 0, finished = false;
  const startTime = performance.now();
  const MIN_LOAD_TIME = 800;

  function setProgress(value) { progress = Math.max(progress, Math.min(100, value)); progressBar.style.width = progress + '%'; percentDisplay.textContent = Math.round(progress) + '%'; }
  const ticker = setInterval(function() { if(finished) return; if(progress < 95) { setProgress(progress + Math.max(0.5, (95 - progress) * 0.04)); } }, 80);
  
  function finishLoading() { 
    if(finished) return; 
    finished = true; 
    const wait = Math.max(0, MIN_LOAD_TIME - (performance.now() - startTime)); 
    setTimeout(function(){ 
      clearInterval(ticker); 
      setProgress(100); 
      setTimeout(function(){ 
        pageLoader.classList.add('loaded'); 
        document.body.classList.remove('is-loading'); 
        setTimeout(() => pageLoader.remove(), 750); 
      }, 400); 
    }, wait); 
  }

  // Guarantee loader hides even if Firebase takes a moment
  document.fonts.ready.then(finishLoading);
  setTimeout(finishLoading, 1500);

  // ===== Theme Toggle =====
  const toggle = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');
  const savedTheme = localStorage.getItem('theme');
  if(savedTheme==='dark'){ document.body.classList.add('dark'); icon.textContent='🌙'; }
  toggle.addEventListener('click', function(){ 
    document.body.classList.toggle('dark'); 
    const isDark=document.body.classList.contains('dark'); 
    icon.textContent=isDark?'🌙':'☀️'; 
    localStorage.setItem('theme',isDark?'dark':'light'); 
    if(window.aboutArt) window.aboutArt.updateTheme(isDark); 
  });

  // ===== Magic Particles =====
  let particleInterval=null, activeMagicElement=null;
  const magicContainer=document.createElement('div');magicContainer.className='magic-particles';document.body.appendChild(magicContainer);
  function randomNumber(min,max){return Math.random()*(max-min)+min;}
  function createMagicParticle(element){if(!element||!element.isConnected)return;if(element.classList.contains('heart-hover'))return;const rect=element.getBoundingClientRect();const angle=Math.random()*Math.PI*2;const radius=Math.max(rect.width,rect.height)*0.35+Math.random()*18;const startX=rect.left+rect.width/2+Math.cos(angle)*radius;const startY=rect.top+rect.height/2+Math.sin(angle)*radius;const isNight=document.body.classList.contains('dark');const particle=document.createElement('span');if(isNight){particle.className='firefly';}else{particle.className='butterfly';particle.innerHTML='<span class="wing left"></span><span class="body"></span><span class="wing right"></span>';}particle.style.left=startX+'px';particle.style.top=startY+'px';particle.style.setProperty('--x1',randomNumber(-25,25)+'px');particle.style.setProperty('--y1',randomNumber(-25,-5)+'px');particle.style.setProperty('--x2',randomNumber(-40,40)+'px');particle.style.setProperty('--y2',randomNumber(-45,-15)+'px');particle.style.setProperty('--x3',randomNumber(-50,50)+'px');particle.style.setProperty('--y3',randomNumber(-65,-30)+'px');particle.style.setProperty('--x4',randomNumber(-70,70)+'px');particle.style.setProperty('--y4',randomNumber(-85,-45)+'px');particle.style.animationDuration=isNight?randomNumber(5.5,7.5)+'s':randomNumber(6.0,8.0)+'s';magicContainer.appendChild(particle);setTimeout(function(){particle.remove();},7000);}
  function startMagic(element){if(element.classList.contains('heart-hover'))return;activeMagicElement=element;if(particleInterval!==null)return;for(let i = 0; i < 2; i++) { createMagicParticle(element); }particleInterval=setInterval(function(){if(activeMagicElement){for(let i = 0; i < 2; i++) { createMagicParticle(activeMagicElement); }}},500);}
  function stopMagic(){activeMagicElement=null;if(particleInterval!==null){clearInterval(particleInterval);particleInterval=null;}}
  document.querySelectorAll('.magic-hover').forEach(function(element){element.addEventListener('mouseenter',function(){if(element.classList.contains('heart-hover'))return;startMagic(element);});element.addEventListener('mouseleave',stopMagic);});

  // ===== Hearts =====
  function getHeartColour(text){if(text.includes('🤍'))return'🤍';if(text.includes('🖤'))return'🖤';if(text.includes('💜'))return'💜';if(text.includes('❤️')||text.includes('♥'))return'♥';return'♥';}
  document.querySelectorAll('*').forEach(function(element){const directText=Array.from(element.childNodes).filter(function(node){return node.nodeType===Node.TEXT_NODE;}).map(function(node){return node.textContent;}).join('');if(directText.includes('♡')||directText.includes('♥')||directText.includes('❤️')||directText.includes('🤍')||directText.includes('🖤')||directText.includes('💜')){element.classList.add('heart-hover');element.classList.remove('magic-hover');}});
  let heartInterval=null, activeHeartElement=null;

  // ===== CART LOGIC =====
  let currentUser = null;
  let productMap = {}; // Map product ID to image path from pages.json
  
  const authButtonText = document.getElementById('authButtonText');

  // Fetch pages.json to map product IDs to images
  fetch('pages.json')
    .then(res => res.json())
    .then(data => {
      if (data.pages) {
        data.pages.forEach(page => {
          productMap[page.id] = page.image;
        });
      }
    })
    .catch(err => console.error('Could not load pages.json', err));

  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    if (user) {
      authButtonText.textContent = user.displayName || user.phoneNumber || 'Account';
      loadCart();
    } else {
      authButtonText.textContent = 'Sign In';
      document.getElementById('cartContent').innerHTML = `
        <div class="empty-cart" style="width:100%;">
          <h2>Please Sign In</h2>
          <p>You need to sign in to view your cart.</p>
          <a href="index.html" class="shop-btn">Go to Sign In</a>
        </div>`;
      finishLoading();
    }
  });

  function loadCart() {
    const cartContent = document.getElementById('cartContent');
    cartContent.innerHTML = '';
    
    db.collection('users').doc(currentUser.uid).collection('cart').get()
      .then(function(querySnapshot) {
        let items = [];
        let total = 0;

        if (querySnapshot.empty) {
          // Simplified empty cart (no suggested/trust sections)
          cartContent.innerHTML = `
            <div class="empty-cart" style="width:100%;">
              <h2>Your cart is empty!</h2>
              <p>Looks like you haven't added anything yet.</p>
              <a href="shop.html" class="shop-btn">Continue Shopping</a>
            </div>`;
          finishLoading();
          return;
        }

        querySnapshot.forEach(function(doc) {
          const item = doc.data();
          items.push(item);
          total += item.price * item.quantity;
        });

        // Render Items with actual images if available
        let itemsHTML = '<div class="cart-items">';
        items.forEach(function(item) {
          const imgPath = productMap[item.id] || '';
          const imgHTML = imgPath 
            ? `<img src="${imgPath}" alt="${item.name}">` 
            : `<span style="font-size:3rem;">${item.image || '🧸'}</span>`;
          itemsHTML += `
            <div class="cart-item">
              <div class="cart-item-img">${imgHTML}</div>
              <div class="cart-item-details">
                <h3>${item.name}</h3>
                <p>Price: ₹${item.price}</p>
              </div>
              <div class="cart-item-controls">
                <div class="cart-item-price">₹${item.price * item.quantity}</div>
                <div class="qty-controls">
                  <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                  <span class="qty-display">${item.quantity}</span>
                  <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
                <button class="remove-btn" onclick="removeItem('${item.id}')">Remove</button>
              </div>
            </div>`;
        });
        itemsHTML += '</div>';

        // Render Summary (including continue shopping button and confetti container)
        const summaryHTML = `
          <div class="cart-summary" id="cartSummary">
            <div class="confetti-container" id="cartConfetti" style="display:none;"></div>
            <h2 class="summary-title">Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><span>₹${total}</span></div>
            <div class="summary-row"><span>Shipping</span><span>Free</span></div>
            <div class="summary-row total"><span>Total</span><span>₹${total}</span></div>
            
            <a href="shop.html" class="continue-shopping">Continue Shopping</a>
            
            <div class="checkout-form">
              <h3>Checkout Details</h3>
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="checkoutName" placeholder="Enter your name" required>
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="checkoutPhone" placeholder="+91 98765 43210" required>
              </div>
              <div class="form-group">
                <label>Delivery Address</label>
                <textarea id="checkoutAddress" rows="4" placeholder="Enter your full address" required></textarea>
              </div>
              <button class="checkout-btn" onclick="placeOrder()">Place Order</button>
            </div>
          </div>`;

        cartContent.innerHTML = itemsHTML + summaryHTML;
        finishLoading();
      })
      .catch(function(err) {
        console.error("Error loading cart: ", err);
        finishLoading();
      });
  }

  window.quickAdd = function(id, name, price, image) {
    if (!currentUser) { alert('Please sign in to add items to your cart.'); return; }
    const cartRef = db.collection('users').doc(currentUser.uid).collection('cart').doc(id);
    cartRef.get().then(function(doc) {
      if (doc.exists) {
        return cartRef.update({ quantity: firebase.firestore.FieldValue.increment(1) });
      } else {
        return cartRef.set({ id, name, price, image, quantity: 1 });
      }
    }).then(function() {
      alert(name + ' added to cart!');
      loadCart();
    });
  };

  window.changeQty = function(itemId, delta) {
    const cartRef = db.collection('users').doc(currentUser.uid).collection('cart').doc(itemId);
    cartRef.get().then(function(doc) {
      if (doc.exists) {
        const newQty = doc.data().quantity + delta;
        if (newQty <= 0) {
          return cartRef.delete().then(loadCart);
        } else {
          return cartRef.update({ quantity: newQty }).then(function() {
            // If increment, launch confetti from summary
            if (delta > 0) {
              launchConfetti();
            }
            loadCart();
          });
        }
      }
    });
  };

  window.removeItem = function(itemId) {
    const cartRef = db.collection('users').doc(currentUser.uid).collection('cart').doc(itemId);
    cartRef.delete().then(loadCart);
  };

  window.placeOrder = function() {
    const name = document.getElementById('checkoutName').value;
    const phone = document.getElementById('checkoutPhone').value;
    const address = document.getElementById('checkoutAddress').value;

    if (!name || !phone || !address) {
      alert("Please fill in all checkout details.");
      return;
    }

    let total = 0;
    const items = [];
    db.collection('users').doc(currentUser.uid).collection('cart').get()
      .then(function(querySnapshot) {
        querySnapshot.forEach(function(doc) {
          items.push(doc.data());
          total += doc.data().price * doc.data().quantity;
        });

        return db.collection('orders').add({
          userId: currentUser.uid,
          userName: name,
          phone: phone,
          address: address,
          items: items,
          total: total,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .then(function() {
        const batch = db.batch();
        return db.collection('users').doc(currentUser.uid).collection('cart').get().then(function(cartSnapshot) {
          cartSnapshot.forEach(function(doc) {
            batch.delete(doc.ref);
          });
          return batch.commit();
        });
      })
      .then(function() {
        alert('Order placed successfully! We will contact you soon.');
        loadCart();
      })
      .catch(function(err) {
        console.error("Error placing order: ", err);
      });
  };

  // ===== Confetti launch =====
  function launchConfetti() {
    const container = document.getElementById('cartConfetti');
    if (!container) return;
    container.style.display = 'block';
    // Clear previous confetti
    container.innerHTML = '';
    
    const colors = ['#ff6b6b', '#ffa500', '#ffd700', '#4CAF50', '#2196F3', '#9C27B0', '#ff69b4'];
    const pieces = 60;
    for (let i = 0; i < pieces; i++) {
      const confetti = document.createElement('span');
      confetti.className = 'confetti-piece';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = (5 + Math.random() * 90) + '%';
      confetti.style.width = (6 + Math.random() * 8) + 'px';
      confetti.style.height = (6 + Math.random() * 8) + 'px';
      confetti.style.borderRadius = Math.random() > 0.4 ? '50%' : '2px';
      confetti.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      confetti.style.animationDelay = (Math.random() * 0.5) + 's';
      container.appendChild(confetti);
    }
    // Remove after animation
    setTimeout(() => {
      container.innerHTML = '';
      container.style.display = 'none';
    }, 5000);
  }

    function drawButterflies(){if(isDark)return;butterflies.forEach(b=>{b.p+=.012;b.x+=b.vx+Math.sin(time*.0009+b.p)*.00008;b.y+=b.vy+Math.cos(time*.0012+b.p)*.00005;if(b.x<.03||b.x>.97)b.vx*=-1;if(b.y<.34||b.y>.70)b.vy*=-1;const x=b.x*width+(mouse.x-.5)*30,y=b.y*height+(mouse.y-.5)*14,flap=.72+.28*Math.sin(time*.02+b.p);ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(b.p)*.18);ctx.globalAlpha=.72;ctx.fillStyle=`hsl(${b.h},68%,76%)`;ctx.beginPath();ctx.ellipse(-4,-3,6,4.5*flap,-.35,0,6.28);ctx.ellipse(-4,3.5,5,3.5*flap,.35,0,6.28);ctx.ellipse(4,-3,6,4.5*flap,.35,0,6.28);ctx.ellipse(4,3.5,5,3.5*flap,-.35,0,6.28);ctx.fill();ctx.fillStyle='#63545b';ctx.fillRect(-1,-5,2,10);ctx.restore();});}
    function drawFireflies(){if(!isDark)return;fireflies.forEach(f=>{f.x+=f.vx+Math.sin(time*.0005+f.p)*.00008;f.y+=f.vy+Math.cos(time*.0008+f.p)*.00005;if(f.x<.01||f.x>.99)f.vx*=-1;if(f.y<.43||f.y>.93)f.vy*=-1;const glow=.25+.75*(.5+.5*Math.sin(time*.0027+f.p)),x=f.x*width,y=f.y*height;ctx.shadowColor='rgba(205,255,172,.8)';ctx.shadowBlur=15;ctx.fillStyle=`rgba(219,255,177,${.18+.72*glow})`;ctx.beginPath();ctx.arc(x,y,f.r*(.65+glow*.55),0,6.28);ctx.fill();ctx.shadowBlur=0;});}
    function drawMeteors(){if(!isDark)return;meteors.forEach(m=>{if(!m.active&&Math.random()<.0012){m.active=true;m.x=rand(.15,.9)*width;m.y=rand(.02,.30)*height;m.vx=rand(7,13);m.vy=rand(3,6);m.life=0;m.max=rand(28,55);}if(m.active){m.x+=m.vx;m.y+=m.vy;m.life++;const a=1-m.life/m.max;ctx.save();ctx.globalAlpha=Math.max(0,a);const grad=ctx.createLinearGradient(m.x-m.vx*7,m.y-m.vy*7,m.x,m.y);grad.addColorStop(0,'rgba(255,255,255,0)');grad.addColorStop(.75,'rgba(255,246,210,.35)');grad.addColorStop(1,'rgba(255,255,255,1)');ctx.strokeStyle=grad;ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*6,m.y-m.vy*6);ctx.stroke();ctx.restore();if(m.life>m.max)m.active=false;}});}
    function draw(){mouse.x=lerp(mouse.x,mouse.tx,.045);mouse.y=lerp(mouse.y,mouse.ty,.045);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);drawSky();drawLandscape();drawWater();drawWindmill();drawVegetation();drawButterflies();drawFireflies();drawMeteors();time+=16;raf=requestAnimationFrame(draw);}
    addEventListener('pointermove',e=>{mouse.tx=e.clientX/width;mouse.ty=e.clientY/height;},{passive:true});
    addEventListener('resize',resize);
    const observer=new MutationObserver(()=>{const d=document.body.classList.contains('dark');if(d!==isDark){isDark=d;init();}});observer.observe(document.body,{attributes:true,attributeFilter:['class']});
    window.aboutArt={updateTheme:(dark)=>{isDark=!!dark;init();}};
    resize();draw();
  })();
</script>
